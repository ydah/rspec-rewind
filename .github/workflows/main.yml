name: Ruby
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: "3.1"
            experimental: false
          - ruby: "3.2"
            experimental: false
          - ruby: "3.3"
            experimental: false
          - ruby: "3.4"
            experimental: false
          - ruby: "4.0"
            experimental: true
          - ruby: "head"
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run specs
        run: bundle exec rake spec
  windows:
    runs-on: windows-latest
    name: Windows Smoke
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Run specs
        run: bundle exec rake spec
  compatibility:
    runs-on: ubuntu-latest
    name: Compatibility (RSpec 3.12)
    timeout-minutes: 15
    env:
      BUNDLE_GEMFILE: gemfiles/rspec_3_12.gemfile
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true
      - name: Verify minimum supported RSpec
        run: bundle exec rspec
  dependency-security:
    runs-on: ubuntu-latest
    name: Dependency Security
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Generate lockfile for audit
        run: bundle lock
      - name: Install bundler-audit
        run: gem install bundler-audit --no-document
      - name: Audit dependencies
        run: bundle-audit check --update
  quality:
    runs-on: ubuntu-latest
    name: Quality
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Type signatures
        run: bundle exec rake rbs
      - name: Coverage
        run: COVERAGE=1 bundle exec rspec
      - name: Build gem
        run: bundle exec rake build
      - name: Install built gem
        run: gem install pkg/rspec-rewind-*.gem --local --no-document
